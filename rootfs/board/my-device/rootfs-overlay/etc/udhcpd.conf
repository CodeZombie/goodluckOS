# USB network mode (usb-mode.sh network): the PC on the other end of the cable gets
# 192.168.36.2. No router or DNS, so the PC keeps its own default route.
interface usb0
start 192.168.36.2
end 192.168.36.2
max_leases 1
# Leases are not kept: the PC's MAC address changes whenever the gadget is rebuilt, and a
# kept lease would hold the only address for the old one
lease_file /dev/null
opt subnet 255.255.255.0
opt lease 86400
