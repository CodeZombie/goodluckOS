# uMTP-Responder: shows HOME on the PC over USB, like a phone does.
# The gadget itself (ACM serial + this MTP function) is set up by /etc/init.d/S30usb-gadget.

# Keep running when the cable is unplugged, so the next plug works too
loop_on_disconnect 1

storage "/home/player" "HOME" "rw"

manufacturer "goodluckOS"
product "GA36MB"
serial "0123456789"
firmware_version "goodluckOS"

mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"

interface "MTP"

usb_functionfs_mode 0x1

usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"

usb_max_packet_size 0x200
